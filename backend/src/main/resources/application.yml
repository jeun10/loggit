spring:
  application:
    name: backend
  config:
    import: optional:file:${LOGGIT_ENV_FILE:../.env}[.properties]
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: 60
